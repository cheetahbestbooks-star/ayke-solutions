name: Publier les articles du blog
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Regenerer blog.html
        run: node build-blog.js
      - name: Committer blog.html si change
        run: |
          git config user.name "Ayke Blog Bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain blog.html)" ]; then
            git add blog.html
            git commit -m "Publication auto du blog ($(date +%F))"
            git push
          else
            echo "Rien de nouveau a publier aujourd hui."
          fi
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Uploader le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deployer le site
        id: deploy
        uses: actions/deploy-pages@v4
